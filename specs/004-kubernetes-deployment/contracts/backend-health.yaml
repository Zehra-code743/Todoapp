## Health Probe Configuration

### Liveness Probe Settings

```yaml
initialDelaySeconds: 30
periodSeconds: 10
timeoutSeconds: 5
failureThreshold: 3
```

**Explanation**:
- **initialDelaySeconds**: Wait 30 seconds after pod starts before first probe (allows application to fully initialize)
- **periodSeconds**: Check every 10 seconds
- **timeoutSeconds**: Probe must complete within 5 seconds
- **failureThreshold**: After 3 consecutive failures (30 seconds total), restart the pod

### Readiness Probe Settings

```yaml
initialDelaySeconds: 10
periodSeconds: 5
timeoutSeconds: 3
failureThreshold: 3
successThreshold: 1
```

**Explanation**:
- **initialDelaySeconds**: Wait 10 seconds after pod starts before first probe (faster than liveness)
- **periodSeconds**: Check every 5 seconds (more frequent than liveness for faster detection)
- **timeoutSeconds**: Probe must complete within 3 seconds
- **failureThreshold**: After 3 consecutive failures (15 seconds total), mark as not ready
- **successThreshold**: Require 1 success to transition to ready

---

## Integration with Kubernetes

### Pod Configuration

Pods MUST configure these probes:

```yaml
spec:
  containers:
  - name: backend
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /ready
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
```

### Expected Behavior

1. **Pod Startup**
   - 0-10s: Pod initializes, probes not running
   - 10s: Readiness probe starts, returns `not ready` if dependencies not ready
   - 30s: Liveness probe starts

2. **Transition to Ready**
   - Once dependencies (database, MCP server) are ready, readiness probe returns `ready`
   - Kubernetes starts routing traffic to pod

3. **During Normal Operation**
   - Liveness probe runs every 10s, pod continues if healthy
   - Readiness probe runs every 5s, pod continues if healthy

4. **Dependency Failure**
   - If database disconnects, readiness returns `not ready`
   - Kubernetes stops routing new traffic
   - Existing connections may drain gracefully
   - Liveness probe continues, pod won't restart unless it also fails

5. **Application Failure**
   - If liveness probe fails 3 consecutive times, Kubernetes restarts pod
   - Recovery depends on application startup and dependency initialization

