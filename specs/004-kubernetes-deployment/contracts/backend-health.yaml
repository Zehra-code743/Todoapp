## Testing Requirements

### Unit Tests

- Test `/health` endpoint returns `healthy` when server is running
- Test `/health` endpoint handles concurrent requests
- Test `/ready` returns `ready` when all dependencies are available
- Test `/ready` returns `not ready` when any dependency is unavailable
- Test error responses have correct status codes

### Integration Tests

- Test Kubernetes liveness probe recognizes `/health` endpoint
- Test Kubernetes readiness probe recognizes `/ready` endpoint
- Test pod restarts when liveness probe fails 3 times
- Test pod marked not ready when readiness probe fails
- Test pod marked ready when readiness probe succeeds

---

## Non-Functional Requirements

- **Performance**: Health checks must complete in <100ms (ready), <200ms (not ready)
- **Reliability**: Health check endpoints must be available 99.9% of time
- **Observability**: Failed health checks should log error context
- **Resource Efficiency**: Health checks should be lightweight (no heavy queries)

---

## Notes

- Database connection check should use a lightweight query (e.g., `SELECT 1` or connection test) rather than a full query
- MCP server status check should verify the process is running without waiting for full initialization
- Health endpoints are public and require no authentication
- Both endpoints are compatible with Kubernetes HTTPGet probe type
