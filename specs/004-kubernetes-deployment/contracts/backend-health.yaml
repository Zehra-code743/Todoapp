# Backend Health Check API Contract

**Feature**: 004-kubernetes-deployment
**Version**: 1.0.0
**Date**: 2026-01-05

## Overview

Health check API contracts for Kubernetes liveness and readiness probes deployed in pods.

---

## Endpoints

### 1. Liveness Check

**Purpose**: Determines if backend pod is alive and functioning. If probe fails repeatedly, Kubernetes restarts the pod.

**Method**: `GET`
**Path**: `/health`
**Authentication**: None (public endpoint for Kubernetes probes)

#### Request

No request body required.

#### Response

**Status**: `200 OK`

```yaml
status:
  type: string
  example: "healthy"
  description: "Health status indicator"
timestamp:
  type: string
  format: date-time
  example: "2026-01-05T12:00:00Z"
  description: "ISO 8601 timestamp when health check was performed"
```

**Response Example**:
```json
{
  "status": "healthy",
  "timestamp": "2026-01-05T12:00:00Z"
}
```

#### Behavior

- Returns `healthy` if backend application server is running
- Returns `healthy` even if external dependencies (database, MCP server) are temporarily unavailable
- Should not perform expensive operations or database queries
- Should complete quickly (<100ms)

#### Error Responses

**Status**: `500 Internal Server Error`

```yaml
status:
  type: string
  example: "unhealthy"
  description: "Health status indicator"
error:
  type: string
  description: "Error message"
  example: "Server internal error"
```

---

### 2. Readiness Check

**Purpose**: Determines if backend pod is ready to serve traffic. If probe fails, Kubernetes stops routing traffic to the pod.

**Method**: `GET`
**Path**: `/ready`
**Authentication**: None (public endpoint for Kubernetes probes)

#### Request

No request body required.

#### Response

**Status**: `200 OK` (Ready) or `503 Service Unavailable` (Not Ready)

##### Ready Response

```yaml
status:
  type: string
  example: "ready"
  description: "Readiness status indicator"
database:
  type: string
  example: "connected"
  description: "Database connection status"
mcp_server:
  type: string
  example: "running"
  description: "MCP server status"
```

**Ready Response Example**:
```json
{
  "status": "ready",
  "database": "connected",
  "mcp_server": "running"
}
```

##### Not Ready Response

**Status**: `503 Service Unavailable`

```yaml
status:
  type: string
  example: "not ready"
  description: "Readiness status indicator"
database:
  type: string
  example: "disconnected"
  description: "Database connection status"
mcp_server:
  type: string
  example: "stopped"
  description: "MCP server status"
```

**Not Ready Response Example**:
```json
{
  "status": "not ready",
  "database": "disconnected",
  "mcp_server": "stopped"
}
```

#### Behavior

- Returns `ready` only when:
  - Backend server is running
  - Database connection is active and can execute queries
  - MCP server is initialized and operational
- Returns `not ready` if any required dependency is unavailable
- Database connection check should be lightweight (simple connection test)
- Should complete quickly (<100ms for ready, <200ms for not ready)

#### Error Responses

**Status**: `500 Internal Server Error`

```yaml
status:
  type: string
  example: "error"
  description: "Error occurred"
error:
  type: string
  description: "Error message"
  example: "Failed to check dependencies"
```

