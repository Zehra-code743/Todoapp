version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: todo-postgres
    environment:
      POSTGRES_DB: todoapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todoapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todo-network

  # Kafka (using Bitnami's image)
  kafka:
    image: bitnami/kafka:latest
    container_name: todo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: 'controller,broker'
      KAFKA_CFG_CONTROLLER_QUORUM_VOTES: '1'
      KAFKA_CFG_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_CFG_ADVERTISED_LISTENERS: 'PLAINTEXT://127.0.0.1:9092'
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
    volumes:
      - kafka_data:/bitnami/kafka/data
    networks:
      - todo-network

  # Zookeeper (required for Kafka)
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: todo-zookeeper
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: 'yes'
    volumes:
      - zookeeper_data:/bitnami/zookeeper/data
    networks:
      - todo-network

  # Task Service
  task-service:
    build:
      context: .
      dockerfile: services/task/Dockerfile
    container_name: todo-task-service
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=todoapp
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - KAFKA_BROKERS=kafka:9092
      - LOG_LEVEL=INFO
    depends_on:
      - postgres
      - kafka
    networks:
      - todo-network

  # Chat API Service
  chat-service:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    container_name: todo-chat-service
    ports:
      - "8001:8001"
    environment:
      - TASK_SERVICE_URL=http://task-service:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=INFO
    depends_on:
      - task-service
    networks:
      - todo-network

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: todo-notification-service
    ports:
      - "8002:8002"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=todoapp
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - KAFKA_BROKERS=kafka:9092
      - LOG_LEVEL=INFO
    depends_on:
      - postgres
      - kafka
    networks:
      - todo-network

  # Recurring Task Service
  recurring-service:
    build:
      context: .
      dockerfile: services/recurring/Dockerfile
    container_name: todo-recurring-service
    ports:
      - "8003:8003"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=todoapp
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - KAFKA_BROKERS=kafka:9092
      - LOG_LEVEL=INFO
    depends_on:
      - postgres
      - kafka
    networks:
      - todo-network

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local

networks:
  todo-network:
    driver: bridge
