name: Deploy to Kubernetes

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r services/task/src/requirements.txt

    - name: Run tests
      run: |
        # Add your test commands here
        echo "Running tests..."
        # pytest tests/  # Uncomment and adjust for your test suite

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    - name: Build and push task service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/task/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/task-service:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/task-service:latest
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push chat service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/chat/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/chat-service:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/chat-service:latest
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push notification service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/notification/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/notification-service:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/notification-service:latest
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push recurring service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/recurring/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/recurring-service:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/recurring-service:latest
        labels: ${{ steps.meta.outputs.labels }}

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: development

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > kubeconfig
        kubectl --kubeconfig=./kubeconfig get nodes

    - name: Deploy to Dev
      run: |
        # Update the image tags in values file
        sed -i "s|tag: \"latest\"|tag: \"${{ github.sha }}\"|g" helm/values.yaml

        # Deploy using Helm
        helm --kubeconfig=./kubeconfig upgrade --install todo-dev ./helm \
          --namespace todo-dev \
          --create-namespace \
          --set taskService.image.tag=${{ github.sha }} \
          --set chatService.image.tag=${{ github.sha }} \
          --set notificationService.image.tag=${{ github.sha }} \
          --set recurringService.image.tag=${{ github.sha }}

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[RELEASE]')
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.PROD_KUBE_CONFIG_DATA }}" | base64 -d > prod-kubeconfig
        kubectl --kubeconfig=./prod-kubeconfig get nodes

    - name: Deploy to Production
      run: |
        # Deploy using Helm to production
        helm --kubeconfig=./prod-kubeconfig upgrade --install todo-prod ./helm \
          --namespace todo-prod \
          --create-namespace \
          --set taskService.image.tag=${{ github.sha }} \
          --set chatService.image.tag=${{ github.sha }} \
          --set notificationService.image.tag=${{ github.sha }} \
          --set recurringService.image.tag=${{ github.sha }}