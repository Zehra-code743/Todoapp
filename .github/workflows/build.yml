name: Build and Test

on:
  push:
    branches: [ develop, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest tests/ -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Security scan with Bandit
      run: |
        pip install bandit
        bandit -r . -ll

    - name: Dependency security scan
      run: |
        pip install safety
        safety check

  docker-build:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Task Service
      run: |
        docker build -f services/task/Dockerfile . --tag task-service:test

    - name: Build Chat Service
      run: |
        docker build -f services/chat/Dockerfile . --tag chat-service:test

    - name: Build Notification Service
      run: |
        docker build -f services/notification/Dockerfile . --tag notification-service:test

    - name: Build Recurring Service
      run: |
        docker build -f services/recurring/Dockerfile . --tag recurring-service:test

    - name: Run container vulnerability scan
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image task-service:test