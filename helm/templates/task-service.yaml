apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-advanced-cloud.fullname" . }}-task-service
  labels:
    {{- include "todo-advanced-cloud.labels" . | nindent 4 }}
    app: task-service
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.taskService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "todo-advanced-cloud.selectorLabels" . | nindent 6 }}
      app: task-service
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        dapr.io/enabled: "true"
        dapr.io/app-id: "task-service"
        dapr.io/app-port: "{{ .Values.taskService.service.port }}"
        dapr.io/components-path: "/dapr-components"
        dapr.io/log-level: "info"
        dapr.io/app-protocol: "http"
        dapr.io/app-max-concurrency: "1"
      labels:
        {{- include "todo-advanced-cloud.selectorLabels" . | nindent 8 }}
        app: task-service
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "todo-advanced-cloud.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-task-service
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.taskService.image.repository }}:{{ .Values.taskService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.taskService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.taskService.service.port }}
              protocol: TCP
          env:
            - name: DB_HOST
              value: {{ .Values.taskService.env.DB_HOST }}
            - name: DB_PORT
              value: {{ .Values.taskService.env.DB_PORT }}
            - name: DB_NAME
              value: {{ .Values.taskService.env.DB_NAME }}
            - name: DB_USER
              value: {{ .Values.taskService.env.DB_USER }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: postgres-password
            - name: KAFKA_BROKERS
              value: {{ .Values.taskService.env.KAFKA_BROKERS }}
            - name: LOG_LEVEL
              value: {{ .Values.taskService.env.LOG_LEVEL }}
          resources:
            {{- toYaml .Values.taskService.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-advanced-cloud.fullname" . }}-task-service
  labels:
    {{- include "todo-advanced-cloud.labels" . | nindent 4 }}
    app: task-service
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.taskService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "todo-advanced-cloud.selectorLabels" . | nindent 4 }}
    app: task-service