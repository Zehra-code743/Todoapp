# Default values for todo-advanced-cloud
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

image:
  repository: todo-app
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "todo-advanced-cloud"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Enable or disable components
kafka:
  enabled: true
  # Kafka configuration
  auth:
    enabled: false
  replicaCount: 1
  zookeeper:
    enabled: true
    replicaCount: 1

postgresql:
  enabled: true
  auth:
    postgresPassword: "postgres"
    database: "todoapp"
  primary:
    persistence:
      enabled: false

dapr:
  enabled: true
  controlPlane:
    resources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  placement:
    resources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  redis:
    resources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# Application services configuration
taskService:
  replicaCount: 1
  image:
    repository: todo-task-service
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    port: 8000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    DB_HOST: "postgresql"
    DB_PORT: "5432"
    DB_NAME: "todoapp"
    DB_USER: "postgres"
    KAFKA_BROKERS: "kafka:9092"
    LOG_LEVEL: "INFO"

chatService:
  replicaCount: 1
  image:
    repository: todo-chat-service
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    port: 8001
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    TASK_SERVICE_URL: "http://task-service:8000"
    OPENAI_API_KEY: ""
    LOG_LEVEL: "INFO"

notificationService:
  replicaCount: 1
  image:
    repository: todo-notification-service
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    port: 8002
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    DB_HOST: "postgresql"
    DB_PORT: "5432"
    DB_NAME: "todoapp"
    DB_USER: "postgres"
    KAFKA_BROKERS: "kafka:9092"
    LOG_LEVEL: "INFO"

recurringService:
  replicaCount: 1
  image:
    repository: todo-recurring-service
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    port: 8003
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    DB_HOST: "postgresql"
    DB_PORT: "5432"
    DB_NAME: "todoapp"
    DB_USER: "postgres"
    KAFKA_BROKERS: "kafka:9092"
    LOG_LEVEL: "INFO"

# Dapr components configuration
daprComponents:
  pubsub:
    name: todo-pubsub
    type: pubsub.kafka
    version: v1
    metadata:
      - name: brokers
        value: "kafka:9092"
      - name: consumerGroup
        value: "todo-services-group"
      - name: clientID
        value: "todo-app"
      - name: authRequired
        value: "false"

  statestore:
    name: todo-statestore
    type: state.postgresql
    version: v1
    metadata:
      - name: connectionString
        value: "host=postgresql user=postgres password={{ .Values.postgresql.auth.postgresPassword }} dbname={{ .Values.postgresql.auth.database }} port=5432 sslmode=disable"

  secrets:
    name: todo-secrets
    type: secretstores.local.file
    version: v1
    metadata:
      - name: secretsFile
        value: "/config/secrets.json"
      - name: nestedSeparator
        value: ":"