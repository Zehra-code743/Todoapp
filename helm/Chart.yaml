apiVersion: v2
name: todo-advanced-cloud
description: A Helm chart for deploying the advanced todo application with event-driven architecture
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: kafka
    version: "20.1.3"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
  - name: postgresql
    version: "12.10.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: dapr
    version: "1.12.0"
    repository: "https://dapr.github.io/helm-charts"
    condition: dapr.enabled